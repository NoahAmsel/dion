
# — Model —
model_dim: 768
n_layer: 12
n_head: 6
sequence_length: 1024

# — Batching & Training —
batch_size: 1024
device_batch_size: 128
num_iterations: 3000

# — Learning‐rate schedule —
warmup_ratio: 0.0
warmdown_ratio: 0.2

# — Validation & Checkpointing —
val_loss_every: 50
val_tokens: 5242880

# — Weights & Biases logging —
wandb_project_name: gpt-train
wandb_job_name: null
no_wandb: false

# — Distributed training —
dp_size: null      # data‐parallel size
fs_size: null      # FSDP size 

# — Miscellaneous flags —
debug: false
no_compile: false
no_triton: false

# — Optimizer & Hyperparameters —
optimizer: muon 
scalar_opt: adamw
adjust_lr: spectral_norm
mu: 0.95
nesterov: false
weight_decay: 0.01
lr: 0.02
